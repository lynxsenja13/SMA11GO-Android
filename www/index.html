<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1,
        viewport-fit=cover">

    <meta name="theme-color" content="#0d47a1">

    <title>SMA11GO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(
                    145deg,
                    #0d47a1 0%,
                    #1976d2 52%,
                    #3da3ee 100%
                );
        }

        /* =====================================================
           STARTUP SCREEN
        ===================================================== */

        .startup {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: #fff;
        }

        /* Lingkaran dekoratif seperti login */

        .startup::before {
            content: "";

            position: absolute;

            width: 390px;
            height: 390px;

            right: -185px;
            top: -170px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, .075);
        }

        .startup::after {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            left: -165px;
            bottom: -205px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, .07);
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .startup-content {
            position: relative;
            z-index: 2;

            width: 100%;

            padding: 40px 30px;

            text-align: center;

            animation:
                startupEnter .45s ease-out both;
        }

        /* Logo */

        .school-logo {
            width: 112px;
            height: 112px;

            margin: 0 auto 30px;

            border-radius: 25px;

            background:
                rgba(255, 255, 255, .96);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .15);
        }

        .school-logo img {
            width: 80px;
            height: 80px;

            object-fit: contain;
        }

        /* Judul */

        .brand-title {
            margin: 0;

            font-size: 48px;
            line-height: 1.05;

            font-weight: 800;

            letter-spacing: .5px;

            color: #fff;
        }

        /* Subtitle */

        .brand-subtitle {
            margin: 12px auto 0;

            max-width: 430px;

            font-size: 16px;
            line-height: 1.55;

            color:
                rgba(255, 255, 255, .92);
        }

        /* Garis kecil seperti identitas login */

        .brand-motto {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            margin-top: 38px;

            color:
                rgba(255, 255, 255, .88);

            font-size: 10px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }

        .brand-motto::before,
        .brand-motto::after {
            content: "";

            width: 42px;
            height: 2px;

            background:
                rgba(255, 255, 255, .78);
        }

        /* =====================================================
           ANIMATION
        ===================================================== */

        @keyframes startupEnter {

            from {
                opacity: 0;
                transform: translateY(10px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .school-logo {
                width: 96px;
                height: 96px;

                border-radius: 22px;

                margin-bottom: 25px;
            }

            .school-logo img {
                width: 68px;
                height: 68px;
            }

            .brand-title {
                font-size: 40px;
            }

            .brand-subtitle {
                max-width: 300px;

                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="startup">

    <div class="startup-content">

        <div class="school-logo">
            <img
                src="icon.png"
                alt="Logo Sekolah">
        </div>

        <h1 class="brand-title">
            SMA11GO
        </h1>

        <div class="brand-subtitle">
            Smart Academic Task &amp;
            Information System
        </div>

        <div class="brand-motto">
            SMA 11
        </div>

    </div>

</div>

<script>
    /*
     * Beri waktu startup screen tampil sebentar,
     * kemudian masuk ke website SMA11GO.
     */

    setTimeout(() => {

        window.location.replace(
            'https://sma11go.site.je/'
        );

    }, 750);
</script>

</body>
</html>
